<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mordeless</title>
<style>
  :root { --fg:#fff; --dim:#a597c9; --line:#8b6ff0; }
  * { box-sizing:border-box; }
  html { background:#000; }
  body { margin:0; background:transparent; color:var(--fg); font-family:"DejaVu Sans Mono", Consolas, monospace; min-height:100vh; padding:20px 16px 110px; }

  .bg { position:fixed; inset:0; z-index:-1; overflow:hidden; background:radial-gradient(ellipse at 50% 0%, #1f1436 0%, #09050f 55%, #000 100%); --mx:-999px; --my:-999px; }
  .skwrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .skwrap canvas { position:absolute; left:0; top:0; }
  #sk { opacity:.18; }
  .bg::before, .bg::after { content:""; position:absolute; width:90vw; height:60vh; border-radius:50%; filter:blur(80px); opacity:.45;
    background:radial-gradient(closest-side, #3a1f6e, transparent); animation:fog 40s ease-in-out infinite alternate; }
  .bg::before { top:5vh; left:-20vw; }
  .bg::after { bottom:-10vh; right:-25vw; animation-duration:55s; animation-direction:alternate-reverse; }
  @keyframes fog { to { transform:translateX(35vw); } }

  .brand { display:flex; flex-direction:column; align-items:flex-start; gap:9px; width:max-content; }
  .logo { display:inline-block; font:700 22px/1 Arial, sans-serif; letter-spacing:.02em; color:var(--fg); text-decoration:none; transition:text-shadow .2s, letter-spacing .2s; }
  .logo:hover, .logo:focus-visible { letter-spacing:.06em; outline:none; text-shadow:-2px 0 #7c3aed, 2px 0 #d8ccff; }
  .flags { display:flex; gap:6px; }
  .flags svg { width:24px; height:16px; border-radius:2px; opacity:.9; }

  header { text-align:center; margin:14px 0 24px; }
  h1 { display:inline-block; font:400 56px/1.1 Arial, Helvetica, sans-serif; margin:0 0 22px; cursor:default; text-shadow:0 0 22px #7c5cff66; }
  h1 span { display:inline-block; text-align:center; transition:transform .3s cubic-bezier(.3,1.5,.5,1), color .3s, text-shadow .3s; }
  h1 span.up { transform:translateY(-12px); color:#e8e0ff; text-shadow:0 0 20px #a78bfa; }
  nav a { display:block; width:max-content; margin:0 auto; color:var(--fg); text-decoration:none; font-size:14px; line-height:1.6; }
  nav a:hover, nav a:focus-visible { text-decoration:underline; text-decoration-color:var(--line); outline:none; }
  nav span { color:var(--dim); }

  .cat { text-align:center; margin:0; padding:2px 0 8px; opacity:.55; font-size:15px; line-height:1.5; color:#e4dbff; }

  #gal { display:grid; grid-template-rows:0fr; transition:grid-template-rows .8s ease; }
  #gal.open { grid-template-rows:1fr; }
  #gal > .clip { overflow:hidden; min-height:0; }
  .frame { --line:#4a3a8c; max-width:1100px; margin:50px auto 30px; color:var(--line); }
  .top { opacity:.5; display:block; width:100%; height:auto; fill:none; stroke:currentColor; stroke-width:1.2; }
  .top .lf { fill:currentColor; fill-opacity:.28; stroke-width:.8; }
  .wrap { position:relative; }
  .shaft { position:absolute; top:0; bottom:0; width:3.3%; border-left:1px solid #4a3a8c88; border-right:1px solid #4a3a8c88;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><g fill='none' stroke='%234a3a8c' stroke-opacity='.7' stroke-width='1'><circle cx='18' cy='12' r='4'/><circle cx='18' cy='24' r='4'/><circle cx='12' cy='18' r='4'/><circle cx='24' cy='18' r='4'/></g></svg>") repeat-y center top / 100% auto; }
  .shaft.l { left:.55%; } .shaft.r { right:.55%; }
  .body { position:relative; margin:0 6.36%; border:1px solid var(--line); border-top:0; padding:34px 3% 64px; }
  .body::before { content:""; position:absolute; inset:0 12px 12px 12px; border:1px solid #4a3a8c55; border-top:0; pointer-events:none; }
  .body::after { content:"✦"; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%); font-size:14px; line-height:1; color:var(--line); background:#06030b; padding:0 8px; }
  .base { position:absolute; left:14px; right:14px; bottom:14px; height:26px; opacity:.7;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 26'><g fill='none' stroke='%234a3a8c' stroke-width='1'><path d='M3 26V15Q3 7 10 2Q17 7 17 15V26M23 26V15Q23 7 30 2Q37 7 37 15V26'/><circle cx='10' cy='14' r='3'/><circle cx='30' cy='14' r='3'/></g></svg>") repeat-x left bottom / auto 100%; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:22px; }

  .fr { aspect-ratio:4/5; padding:0; background:none; cursor:zoom-in; border:1px solid #8b6ff055; transition:border-color .4s, box-shadow .4s; }
  .fr:hover, .fr:focus-visible { border-color:#cdbcff; box-shadow:0 0 22px #7c5cff55; outline:none; }
  .fr img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; filter:grayscale(.4) brightness(.8); transition:filter .5s, opacity .9s; }
  .fr img.in { opacity:1; }
  .fr:hover img, .fr:focus-visible img { filter:none; }

  #view { position:fixed; inset:0; z-index:10; background:#05020af2; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #view.on { display:flex; }
  #view img { max-width:88vw; max-height:80vh; }
  #cap { font-size:16px; text-align:center; padding:0 60px; }
  #cnt { font-size:12px; color:var(--dim); }
  .nv { position:absolute; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--fg); font:300 56px/1 Arial, sans-serif; padding:20px; cursor:pointer; opacity:.6; }
  .nv:hover, .nv:focus-visible { opacity:1; outline:none; color:#cdbcff; }
  #prev { left:8px; } #next { right:8px; }
  #x { position:absolute; top:10px; right:14px; background:none; border:0; color:var(--fg); font-size:28px; cursor:pointer; opacity:.6; }
  #x:hover { opacity:1; }

  footer { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:18px 16px; text-align:center; background:linear-gradient(transparent, #000 45%); }
  #player { background:none; border:0; color:var(--fg); font:inherit; font-size:18px; cursor:pointer; display:inline-flex; align-items:center; gap:12px; }
  #player:hover, #player:focus-visible { text-decoration:underline; text-decoration-color:var(--line); outline:none; }
  .bar { display:inline-flex; align-items:center; gap:20px; }
  #vol { -webkit-appearance:none; appearance:none; width:90px; height:16px; background:transparent; cursor:pointer; margin:0; --v:70%; }
  #vol:focus-visible { outline:1px solid #8b6ff0; outline-offset:2px; }
  #vol::-webkit-slider-runnable-track { height:1px; background:linear-gradient(to right, #cdbcff var(--v), #4a3a8c var(--v)); }
  #vol::-webkit-slider-thumb { -webkit-appearance:none; width:9px; height:9px; border-radius:50%; background:#fff; margin-top:-4px; }
  #vol::-moz-range-track { height:1px; background:#4a3a8c; }
  #vol::-moz-range-progress { height:1px; background:#cdbcff; }
  #vol::-moz-range-thumb { width:9px; height:9px; border:0; border-radius:50%; background:#fff; }
  .volw { display:inline-flex; align-items:center; }
  #vbtn { background:none; border:0; color:var(--fg); padding:4px; cursor:pointer; display:inline-flex; opacity:.85; }
  #vbtn:hover, #vbtn:focus-visible { opacity:1; outline:none; }
  #vbtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
  #vbtn .x { display:none; }
  .volw.muted .w { display:none; } .volw.muted .x { display:inline; }
  #vol { width:0; opacity:0; margin-left:0; pointer-events:none; transition:width .3s, opacity .3s, margin .3s; }
  .volw:hover #vol, .volw:focus-within #vol, .volw.open #vol { width:90px; opacity:1; margin-left:8px; pointer-events:auto; }
  .eq { display:none; align-items:flex-end; gap:2px; height:16px; }
  body.playing .eq { display:inline-flex; }
  .eq i { width:3px; height:4px; background:#cdbcff; }
  body.playing .eq i { animation:eq .9s ease-in-out infinite alternate; }
  body.playing .eq i:nth-child(2) { animation-delay:-.3s; }
  body.playing .eq i:nth-child(3) { animation-delay:-.6s; }
  @keyframes eq { to { height:16px; } }

  @media (max-width:640px) {
    body { padding:16px 12px 100px; }
    .logo { font-size:20px; }
    h1 { font-size:44px; }
    nav a { font-size:15px; padding:3px 0; }
    .frame { margin-top:30px; }
    .grid { grid-template-columns:repeat(2, 1fr); gap:12px; }
    .body { padding:22px 3% 48px; }
      #player { font-size:15px; }
    .bar { gap:14px; }
    .volw:hover #vol, .volw:focus-within #vol, .volw.open #vol { width:70px; }
    .nv { font-size:40px; padding:12px; }
    #cap { font-size:14px; padding:0 20px; }
    #view img { max-width:96vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg::before, .bg::after, .skwrap, #sk { animation:none; }
    #gal, .fr, .fr img, .logo, h1 span { transition:none; }
    body.playing .eq i { animation:none; height:10px; }
  }

<script>
  const PHOTOS = [
    "cRazYWork.jpg", "traile.jpg", "upup.jpg", "believe.jpg","connexion.jpg","vyatkahill.jpg", "serpent.jpg", "l' espoir.jpg", "obscurité.jpg", "verdure.jpg", "ya.jpg","MOUSSE.jpg","industriel2.jpg",
    "domination sur le secteur industriel.jpg","industriel.jpg","vilenie.jpg","restes2.jpg",
    "colère.jpg", "rapidité.jpg","glaz .jpg","ijJ.jpg",
    "les horreurs de l'industriel.jpg", "pylinka.jpg"
  ];
  const STREAM_URL = "https://rrock.fluidstream.eu/radiorock.aac";
  const FRAMES = [" mordeless","s mordeles","ss mordele","ess mordel","less morde","eless mord","deless mor","rdeless mo","ordeless m","mordeless"," mördeless"," mördeless"].map(s => s.trimEnd() + " €");

  const $ = id => document.getElementById(id);
  const src = n => "photos/" + encodeURIComponent(n);
  const title = n => n.replace(/\.[^.]+$/, "").trim();
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let f = 0;
  setInterval(() => { document.title = document.hidden ? "torna qui…" : FRAMES[f++ % FRAMES.length]; }, 300);

  const nm = $("name"), WORD = "kratte";
  nm.innerHTML = [...WORD].map((c, i) => `<span>${i ? c : c.toUpperCase()}</span>`).join("");
  const sp = [...nm.children];
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    sp.forEach((s, j) => {
      s.textContent = WORD[j].toUpperCase(); const a = s.offsetWidth;
      s.textContent = WORD[j]; const b = s.offsetWidth;
      s.style.width = Math.max(a, b) + "px";
      s.textContent = j ? WORD[j] : WORD[j].toUpperCase();
    });
  });
  function setCap(i, lift) {
    sp.forEach((s, j) => { s.textContent = j === i ? WORD[j].toUpperCase() : WORD[j]; s.classList.toggle("up", lift && j === i); });
  }
  let hovered = false, running = false;
  async function loop() {
    if (running) return; running = true;
    setCap(0, true); await sleep(230);
    do {
      for (let i = 1; i < WORD.length; i++) { setCap(i, true); await sleep(190); }
      setCap(0, true); await sleep(260);
    } while (hovered);
    setCap(0, false);
    running = false;
  }
  nm.onmouseenter = () => { hovered = true; loop(); };
  nm.onmouseleave = () => { hovered = false; };
  setTimeout(loop, 500);


  const sk = $("sk"), wrapEl = $("skwrap");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = innerWidth < 700;
  const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let parts = [], dpr = 1, sc = 1;
  const sprites = new Map();
  function sprite(chr, size) {
    const key = chr + size; let s = sprites.get(key); if (s) return s;
    const w = Math.ceil(size * 1.6 * dpr);
    s = document.createElement("canvas"); s.width = s.height = w;
    const g = s.getContext("2d");
    g.fillStyle = "#e6dcff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `italic ${Math.round(size * dpr)}px "Segoe Script","Brush Script MT","Lucida Handwriting",cursive,serif`;
    g.fillText(chr, w / 2, w / 2);
    sprites.set(key, s); return s;
  }
  // Череп как на футболке: круглый череп, косые глазницы, маленький нос, узкая челюсть с «потёками»
  function buildSkull() {
    dpr = Math.min(devicePixelRatio || 1, 2); sprites.clear();
    const H = Math.min(innerHeight * .8, innerWidth * 1.09), Wd = H * 325 / 370; sc = H / 900;
    wrapEl.style.width = Wd + "px"; wrapEl.style.height = H + "px";
    [sk].forEach(c => { c.width = Wd * dpr; c.height = H * dpr; c.style.width = Wd + "px"; c.style.height = H + "px"; });
    const m = document.createElement("canvas"); m.width = 325; m.height = 370;
    const x = m.getContext("2d");
    x.fillStyle = "#000"; x.fillRect(0, 0, 325, 370);
    const g = x.createRadialGradient(162, 90, 10, 162, 150, 230); g.addColorStop(0, "#fff"); g.addColorStop(1, "#9a9a9a");
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, 150); x.bezierCurveTo(0, 40, 70, 0, 162, 0); x.bezierCurveTo(255, 0, 325, 40, 325, 150);
    x.bezierCurveTo(325, 200, 315, 235, 305, 255); x.lineTo(20, 255); x.bezierCurveTo(10, 235, 0, 200, 0, 150); x.fill();
    const J = [[240,250],[238,296],[228,316],[222,330],[212,312],[204,322],[196,306],[184,320],[176,338],[168,318],[158,334],[148,368],[140,346],[130,322],[118,336],[112,356],[104,330],[96,300],[94,250]];
    x.beginPath(); J.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill();
    x.fillStyle = "#000";
    x.beginPath(); x.moveTo(33,175); x.quadraticCurveTo(45,142,85,140); x.quadraticCurveTo(125,150,143,190); x.quadraticCurveTo(140,235,95,238); x.quadraticCurveTo(40,235,33,175); x.fill();
    x.beginPath(); x.moveTo(291,175); x.quadraticCurveTo(279,142,239,140); x.quadraticCurveTo(199,150,181,190); x.quadraticCurveTo(184,235,229,238); x.quadraticCurveTo(284,235,291,175); x.fill();
    x.beginPath(); x.moveTo(162,242); x.quadraticCurveTo(150,265,138,284); x.lineTo(186,284); x.quadraticCurveTo(174,265,162,242); x.fill();
    const d = x.getImageData(0, 0, 325, 370).data, R = rnd(42);
    const cols = small ? 60 : 96, cw = Wd / cols, ch = cw * 1.75, rows = Math.floor(H / ch);
    const S = "abcdefghijklmnopqrstuvwxyzABCDEFGHJKLMNRSTWXZ", D = "MWKRBNHAQXZWMEKS";
    parts = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const v = d[(Math.floor((r + .5) / rows * 370) * 325 + Math.floor((c + .5) / cols * 325)) * 4] / 255;
      if (v < .2) continue;
      const set = v > .78 ? D : S, chr = set[Math.floor(R() * set.length)];
      const sp = sprite(chr, Math.round(ch * [.95, 1.3, 1.7][Math.floor(R() * 3)]));
      const hx = (c + .5 + (R() - .5) * .8) * cw, hy = (r + .5 + (R() - .5) * .6) * ch;
      const rot = (R() - .5) * .5, ang = R() * 6.283, dist = (12 + R() * 48) * sc * (small ? .7 : 1);
      parts.push({ sp, w: sp.width / dpr, hx, hy, c: Math.cos(rot), s: Math.sin(rot), a: .35 + .65 * v,
        dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, ox: 0, oy: 0,
        ph: Math.hypot(hx - Wd / 2, hy - H / 2) / Wd * 3.3 + R() * .5 });
    }
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(buildSkull, 250); });
  buildSkull();

  // Цикл «дыхания»: буквы сами разлетаются и собираются (с курсором не взаимодействуют)
  function tick(t) {
    const ctx = sk.getContext("2d"), T = t / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, sk.width, sk.height);
    for (const p of parts) {
      let b = reduce ? 0 : .5 - .5 * Math.cos(T * .7 - p.ph);
      b = b * b * (3 - 2 * b);
      ctx.setTransform(dpr * p.c, dpr * p.s, -dpr * p.s, dpr * p.c, dpr * (p.hx + p.dx * b), dpr * (p.hy + p.dy * b));
      ctx.globalAlpha = p.a;
      ctx.drawImage(p.sp, -p.w / 2, -p.w / 2, p.w, p.w);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);


  const gal = $("gal"), port = $("port"), grid = $("grid");
  let built = false;
  function build() {
    built = true;
    PHOTOS.forEach((n, i) => {
      const b = document.createElement("button");
      b.className = "fr"; b.type = "button"; b.setAttribute("aria-label", title(n));
      const img = new Image(); img.alt = ""; img.loading = "lazy";
      img.onload = () => img.classList.add("in");
      img.onerror = () => { console.warn("Не найдено фото:", n); b.remove(); };
      img.src = src(n);
      b.appendChild(img); b.onclick = () => show(i);
      grid.appendChild(b);
    });
  }
  port.onclick = e => {
    e.preventDefault();
    if (!built) build();
    const open = gal.classList.toggle("open");
    port.setAttribute("aria-expanded", open);
    if (open) setTimeout(() => gal.scrollIntoView({ behavior:"smooth", block:"start" }), 150);
  };

  const view = $("view"), vimg = view.querySelector("img");
  let cur = 0;
  function show(i) {
    const N = PHOTOS.length; cur = (i + N) % N;
    vimg.src = src(PHOTOS[cur]);
    $("cap").textContent = title(PHOTOS[cur]);
    $("cnt").textContent = (cur + 1) + " / " + N;
    view.classList.add("on");
  }
  const close = () => view.classList.remove("on");
  $("prev").onclick = e => { e.stopPropagation(); show(cur - 1); };
  $("next").onclick = e => { e.stopPropagation(); show(cur + 1); };
  $("x").onclick = close;
  view.onclick = e => { if (e.target === view) close(); };
  vimg.onclick = close;
  addEventListener("keydown", e => {
    if (!view.classList.contains("on")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
  let sx = null;
  view.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive:true });
  view.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });

  const audio = $("audio"), btn = $("player"), txt = $("t");
  const label = on => {
    document.body.classList.toggle("playing", on);
    txt.textContent = (on ? "" : "▶ ") + "radiorock.it";
  };
  label(false);
  function toggle() {
    if (audio.paused) { audio.src = STREAM_URL; audio.play().then(() => label(true)).catch(() => label(false)); }
    else { audio.pause(); audio.removeAttribute("src"); audio.load(); label(false); }
  }
  btn.onclick = toggle;
  const vol = $("vol");
  let v0 = .7;
  try { const sv = localStorage.getItem("vol"); if (sv !== null && !isNaN(+sv)) v0 = +sv; } catch (e) {}
  audio.volume = v0;
  if (Math.abs(audio.volume - v0) > .01) $("volw").style.display = "none";   // iPhone не даёт менять громкость из страницы
  vol.value = Math.round(v0 * 100);
  const setV = () => {
    audio.volume = vol.value / 100; vol.style.setProperty("--v", vol.value + "%");
    try { localStorage.setItem("vol", vol.value / 100); } catch (e) {}
  };
  const volw = $("volw");
  const setV2 = () => { setV(); volw.classList.toggle("muted", +vol.value === 0); };
  vol.oninput = setV2; setV2();
  $("vbtn").onclick = e => { e.stopPropagation(); volw.classList.toggle("open"); };
  addEventListener("pointerdown", e => { if (!volw.contains(e.target)) volw.classList.remove("open"); });
</script>
</body>
</html>
