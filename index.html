<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mordeless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink:#121212; --paper:#d9d6cf; --card:#f1eee7; --red:#c8141c; --tape:#cdbb7a99; --dim:#8a857b; }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body { margin:0; background:transparent; color:var(--ink); font-family:"Special Elite","Courier New",Courier,monospace; min-height:100vh; padding:20px 16px 70px; }

  /* фон: ксерокс-бумага, зерно, тёмные края копира, полосы тонера */
  .bg { position:fixed; inset:0; z-index:-1; background:var(--paper); }
  .bg::before { content:""; position:absolute; inset:0; opacity:.28; background-image:var(--noise); }
  .bg::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 120px #0009;
    background:linear-gradient(90deg, transparent 11%, #00000012 11.1%, transparent 11.4%),
               linear-gradient(90deg, transparent 63%, #0000000d 63.1%, transparent 63.3%),
               linear-gradient(90deg, transparent 87%, #00000014 87.1%, transparent 87.5%); }

  .brand { position:absolute; top:20px; left:16px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; width:max-content; }
  .logo { display:inline-grid; overflow:hidden; background:var(--ink); color:var(--card); font:700 20px/1 Arial, sans-serif; letter-spacing:.03em; padding:7px 11px; text-decoration:none; transform:rotate(-2deg); box-shadow:3px 3px 0 var(--red); transition:transform .3s cubic-bezier(.3,1.5,.5,1); }
  .logo span { grid-area:1 / 1; text-align:center; transition:opacity .25s ease, transform .3s cubic-bezier(.3,1.4,.5,1); }
  .logo .a { letter-spacing:.16em; }
  .logo .b { opacity:0; transform:translateY(70%); }
  .logo:hover, .logo:focus-visible { transform:rotate(1.5deg) scale(1.05); outline:none; }
  .logo:hover .a, .logo:focus-visible .a { opacity:0; transform:translateY(-70%); }
  .logo:hover .b, .logo:focus-visible .b { opacity:1; transform:none; }
  .flags { display:flex; gap:6px; padding-left:4px; }
  .flags svg { width:24px; height:16px; box-shadow:0 0 0 1px var(--ink); }

  #stage { min-height:calc(100vh - 90px); display:flex; flex-direction:column; justify-content:center; }
  header { text-align:center; margin:18px 0 26px; }
  /* имя как вырезки из газет (записка с угрозами) */
  h1 { --fs:66px; display:inline-flex; align-items:center; gap:4px; margin:6px 0 30px; line-height:1; cursor:default; transform:rotate(-1.5deg); }
  h1 span { display:inline-block; text-align:center; padding:4px 9px 6px; box-shadow:3px 4px 0 #0005; transform:rotate(var(--r,0deg)) translateY(var(--y,0px)); transition:transform .45s cubic-bezier(.3,1.5,.5,1); }
  h1 span.up { --y:-16px; }
  h1 span:nth-child(1) { --r:-4deg; background:var(--ink); color:var(--card); font:700 var(--fs)/1.05 Georgia, "Times New Roman", serif; }
  h1 span:nth-child(2) { --r:3deg; background:var(--card); color:var(--ink); font:900 calc(var(--fs) * .94)/1.05 "Arial Black", Impact, sans-serif; }
  h1 span:nth-child(3) { --r:-2deg; background:var(--red); color:var(--card); font:700 var(--fs)/1.05 "Courier New", monospace; }
  h1 span:nth-child(4) { --r:4deg; background:#b9b4a8; color:var(--ink); font:italic 700 var(--fs)/1.05 Georgia, serif; }
  h1 span:nth-child(5) { --r:-3deg; background:var(--ink); color:var(--card); font:400 calc(var(--fs) * 1.06)/1.05 Impact, "Arial Narrow", sans-serif; }
  h1 span:nth-child(6) { --r:2deg; background:var(--card); color:var(--red); font:900 calc(var(--fs) * .94)/1.05 "Arial Black", Impact, sans-serif; }

  nav { display:flex; justify-content:center; align-items:flex-start; gap:30px; flex-wrap:wrap; padding-top:8px; }
  nav a { position:relative; display:block; padding:9px 20px; background:var(--ink); color:var(--card); text-decoration:none; font-size:16px; font-weight:700; letter-spacing:.04em; line-height:1.3; transform:rotate(var(--r,0deg)); box-shadow:4px 5px 0 #0004; transition:transform .35s cubic-bezier(.3,1.4,.5,1); }
  nav a:nth-child(1) { --r:-3deg; }
  nav a:nth-child(2) { --r:2.2deg; margin-top:10px; }
  nav a::before { content:""; position:absolute; top:-9px; left:50%; width:48px; height:15px; margin-left:-24px; background:var(--tape); transform:rotate(-4deg); }
  nav a:hover, nav a:focus-visible { transform:rotate(0deg) translateY(-4px) scale(1.06); outline:none; }

  .cat { display:flex; justify-content:center; align-items:flex-start; flex-wrap:wrap; gap:26px; text-align:center; margin:6px 0 8px; font-size:15px; line-height:1.5; }
  .cat span { position:relative; display:inline-block; background:var(--card); color:var(--ink); padding:9px 16px; transform:rotate(-1.2deg); box-shadow:3px 4px 0 #0003; }
  .cat span { max-width:min(430px, 86vw); }
  .cat i { display:block; margin-top:8px; text-align:right; font-style:normal; font-size:13px; opacity:.7; }
  .cat.mail { position:fixed; right:20px; bottom:18px; margin:0; z-index:5; }
  .cat.mail span { transform:rotate(1.8deg); }
  .cat.mail span::before { transform:rotate(-4deg); }
  .cat span::before { content:""; position:absolute; top:-8px; left:50%; width:44px; height:14px; margin-left:-22px; background:var(--tape); transform:rotate(3deg); }

  #gal { display:grid; grid-template-rows:0fr; transition:grid-template-rows .8s ease; }
  #gal.open { grid-template-rows:1fr; }
  #gal > .clip { overflow:hidden; min-height:0; }
  /* чёрный картон, на который налеплены фото (рваные края считает скрипт) */
  .boardwrap { max-width:1100px; margin:44px auto 36px; filter:drop-shadow(0 14px 14px #0007); }
  .board { position:relative; background:linear-gradient(#1b1816, #12100f); padding:50px 34px 56px; }
  .board::before { content:""; position:absolute; inset:0; background-image:var(--noisew); opacity:.1; pointer-events:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); grid-auto-flow:dense; gap:38px 28px; padding:10px 0; }

  /* фото как отпечатки со скотчем: слегка приглушены, при наведении оживают */
  .fr { position:relative; aspect-ratio:4/5; padding:8px 8px 28px; background:var(--card); border:0; cursor:zoom-in; transform:rotate(var(--r,0deg)) translateY(var(--y,0px)); box-shadow:3px 5px 0 #0003; transition:transform .4s cubic-bezier(.3,1.4,.5,1), box-shadow .4s; }
  .fr.wide { grid-column:span 2; aspect-ratio:3/2; }
  .fr::before { content:""; position:absolute; top:-10px; left:50%; width:58px; height:17px; margin-left:-29px; background:var(--tape); transform:rotate(-3deg); z-index:2; pointer-events:none; }
  .fr::after { content:attr(data-n); position:absolute; left:10px; bottom:7px; font-size:12px; line-height:1; letter-spacing:.12em; color:var(--ink); pointer-events:none; }
  .fr:hover, .fr:focus-visible { transform:rotate(0deg) translateY(-6px) scale(1.04); z-index:3; box-shadow:6px 10px 0 #0003; outline:none; }
  .fr img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; filter:grayscale(.3) saturate(.85) brightness(.88) contrast(1.05); transition:filter .5s, opacity .9s; }
  .fr img.in { opacity:1; }
  .fr:hover img, .fr:focus-visible img { filter:none; }
  .fr img.gl { animation:gl .4s steps(2, end); }
  @keyframes gl {
    0%   { clip-path:inset(0 0 0 0); transform:translate(0); }
    20%  { clip-path:inset(12% 0 58% 0); transform:translate(-5px, 0); filter:drop-shadow(-3px 0 #ff2a3a) drop-shadow(3px 0 #2ad4ff); }
    45%  { clip-path:inset(58% 0 14% 0); transform:translate(5px, 0); filter:drop-shadow(3px 0 #ff2a3a) drop-shadow(-3px 0 #2ad4ff); }
    70%  { clip-path:inset(0 0 0 0); transform:translate(-2px, 0); }
    100% { clip-path:inset(0 0 0 0); transform:translate(0); filter:none; }
  }

  #view { position:fixed; inset:0; z-index:1000; background:#0b0a09f2; color:var(--card); display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #view.on { display:flex; }
  #zbox { overflow:hidden; line-height:0; cursor:zoom-in; max-width:96vw; }
  #zbox.z { cursor:zoom-out; }
  #view img { display:block; transition:transform .25s ease; will-change:transform; max-width:88vw; max-height:80vh; touch-action:none; user-select:none; -webkit-touch-callout:none; }
  #cap { font-size:16px; text-align:center; padding:0 60px; }
  #cnt { font-size:12px; color:#9a958c; }
  .nv { position:absolute; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--card); font:300 56px/1 Arial, sans-serif; padding:20px; cursor:pointer; opacity:.6; }
  .nv:hover, .nv:focus-visible { opacity:1; outline:none; color:#ff5058; }
  #prev { left:8px; } #next { right:8px; }
  #x { position:absolute; top:10px; right:14px; background:none; border:0; color:var(--card); font-size:28px; cursor:pointer; opacity:.6; }
  #x:hover { opacity:1; }

  /* таскаемые бумажки */
  h1 span, .cat span, nav a { touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
  h1 span { position:relative; }
  .drag { cursor:grabbing !important; box-shadow:8px 12px 0 #0004 !important; }

  @media (max-width:640px) {
    .cat.mail { position:static; margin-top:6px; }
    body { padding:16px 12px 70px; }
    .brand { top:16px; left:12px; }
    #stage { min-height:calc(100vh - 86px); }
    .logo { font-size:18px; }
    h1 { --fs:40px; }
    nav { gap:20px; }
    nav a { font-size:15px; padding:8px 14px; }
    .boardwrap { margin-top:30px; }
    .grid { grid-template-columns:repeat(2, 1fr); gap:28px 14px; }
    .fr { padding:6px 6px 22px; }
    .board { padding:34px 14px 40px; }
    .nv { font-size:40px; padding:12px; }
    #cap { font-size:14px; padding:0 20px; }
    #view img { max-width:96vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    #gal, .fr, .fr img, .logo, .logo span, nav a, h1 span { transition:none; }
    .fr img.gl { animation:none; }
  }

</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="brand">
    <a class="logo" href="https://discord.gg/A2aPdQKNXQ" target="_blank" rel="noopener" aria-label="KRATNET / морделесс (Discord)"><span class="a">KRATNET</span><span class="b">морделесс</span></a>
    <div class="flags" aria-hidden="true">
      <svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#fff"/><rect y=".667" width="3" height=".667" fill="#0039a6"/><rect y="1.333" width="3" height=".667" fill="#d52b1e"/></svg>
      <svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>
      <svg viewBox="0 0 60 40" preserveAspectRatio="none"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="14"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="8"/></svg>
    </div>
  </div>

  <main id="stage">
  <header>
    <h1 id="name" aria-label="Kratte"></h1>
    <nav>
      <a href="https://t.me/+bdkxk6NwtBAwMWQy" target="_blank" rel="noopener">> telegram <</a>
      <a href="#" id="port" aria-expanded="false" aria-controls="gal">> portfolio <</a>
    </nav>
  </header>


  <section id="gal"><div class="clip"><div class="boardwrap"><div class="board" id="board"><div class="grid" id="grid"></div></div></div></div></section>

  <div class="cat"><span>«These last few days are among the happiest I've ever ignored.»<i>— Doug Kenney</i></span></div>
  <div class="cat mail"><span>contact@kratnet.ru</span></div>
  </main>

  <div id="view">
    <button id="x" aria-label="Закрыть">×</button>
    <button class="nv" id="prev" aria-label="Назад">‹</button>
    <div id="zbox"><img alt=""></div>
    <div id="cap"></div><div id="cnt"></div>
    <button class="nv" id="next" aria-label="Вперёд">›</button>
  </div>

<script>
  

  const PHOTOS = [
    "DSC_0029.jpg", "DSC_0031.jpg", "DSC_0045.jpg", "DSC_0075.jpg", "DSC_0080.jpg",
    "cRazYWork.jpg", "traile.jpg", "upup.jpg", "believe.jpg","connexion.jpg","vyatkahill.jpg", "serpent.jpg", "l' espoir.jpg", "verdure.jpg", "ya.jpg","MOUSSE.jpg","industriel2.jpg",
    "domination sur le secteur industriel.jpg", "otpe4atok.jpg", "iron_vagina.jpg", "industriel.jpg","vilenie.jpg","restes2.jpg",
    "colère.jpg", "glaz .jpg","ijJ.jpg",
    "les horreurs de l'industriel.jpg", "pylinka.jpg"
  ];
  const FRAMES = [" mordeless","s mordeles","ss mordele","ess mordel","less morde","eless mord","deless mor","rdeless mo","ordeless m","mordeless"," mördeless"," mördeless"].map(s => s.trimEnd() + " €");

  (function () {   // зерно рисуем сами (случайные пиксели), без тяжёлых SVG-фильтров
    try {
      const c = document.createElement("canvas"); c.width = c.height = 200;
      const x = c.getContext("2d"), im = x.createImageData(200, 200), root = document.documentElement.style;
      const mk = v => { for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = Math.random() * 255; } x.putImageData(im, 0, 0); return `url(${c.toDataURL()})`; };
      root.setProperty("--noise", mk(0)); root.setProperty("--noisew", mk(255));
    } catch (e) {}
  })();
  const $ = id => document.getElementById(id);
  const src = n => "photos/" + encodeURIComponent(n);
  const title = n => n.replace(/\.[^.]+$/, "").trim();
  const sleep = ms => new Promise(r => setTimeout(r, ms));


  let f = 0;
  setInterval(() => { document.title = document.hidden ? "torna qui…" : FRAMES[f++ % FRAMES.length]; }, 300);

  const nm = $("name"), WORD = "kratte";
  nm.innerHTML = [...WORD].map((c, i) => `<span>${i ? c : c.toUpperCase()}</span>`).join("");
  const sp = [...nm.children];
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    sp.forEach((s, j) => {
      s.textContent = WORD[j].toUpperCase(); const a = s.offsetWidth;
      s.textContent = WORD[j]; const b = s.offsetWidth;
      s.style.width = Math.max(a, b) + "px";
      s.textContent = j ? WORD[j] : WORD[j].toUpperCase();
    });
  });
  function setCap(i, lift) {
    sp.forEach((s, j) => { s.textContent = j === i ? WORD[j].toUpperCase() : WORD[j]; s.classList.toggle("up", lift && j === i); });
  }
  let hovered = false, running = false;
  async function loop() {
    if (running) return; running = true;
    setCap(0, true); await sleep(340);
    do {
      for (let i = 1; i < WORD.length; i++) { setCap(i, true); await sleep(300); }
      setCap(0, true); await sleep(400);
    } while (hovered);
    setCap(0, false);
    running = false;
  }
  nm.onmouseenter = () => { hovered = true; loop(); };
  nm.onmouseleave = () => { hovered = false; };
  setTimeout(loop, 500);


  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;


  (function () {   // рваные верх и низ у чёрного картона
    const R = rnd(21), n = 44, pts = [];
    for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(2)}% ${Math.round(R() * 10)}px`);
    for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(2)}% calc(100% - ${Math.round(R() * 10)}px)`);
    $("board").style.clipPath = `polygon(${pts.join(",")})`;
  })();
  // бумажки (буквы имени, записки, ярлыки) можно таскать мышью или пальцем; ссылки при этом не открываются
  let zTop = 20;
  function makeDraggable(el) {
    let sx = 0, sy = 0, ox = 0, oy = 0, dx = 0, dy = 0, id = null, moved = false, blocked = false;
    el.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      id = e.pointerId; el.setPointerCapture(id); sx = e.clientX; sy = e.clientY; dx = dy = 0; moved = false; blocked = false;
      el.style.zIndex = Math.min(++zTop, 900);
      const t = getComputedStyle(el).translate; ox = oy = 0;      // подхватываем текущее место (в т.ч. если бумажка ещё едет назад)
      if (t && t !== "none") { const q = t.split(" "); ox = parseFloat(q[0]) || 0; oy = parseFloat(q[1]) || 0; }
      el.style.transition = ""; el.style.translate = `${ox}px ${oy}px`;
    });
    el.addEventListener("pointermove", e => {
      if (e.pointerId !== id) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true; el.classList.add("drag");
      el.style.translate = `${ox + dx}px ${oy + dy}px`;
    });
    const end = e => {
      if (e.pointerId !== id) return;
      if (moved) { ox += dx; oy += dy; blocked = true; }
      el.classList.remove("drag"); id = null;
    };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
    el.addEventListener("click", e => { if (blocked) { e.preventDefault(); e.stopPropagation(); } blocked = false; }, true);
  }
  const drags = [...document.querySelectorAll("h1 span, .cat span, nav a")];
  drags.forEach(makeDraggable);

  // 10 секунд без действий (мышь, клики, клавиши, прокрутка, касания) или ушёл со страницы: всё плавно возвращается на место
  let idleT;
  function returnAll() {
    drags.forEach(el => {
      if (el.classList.contains("drag")) return;
      const t = getComputedStyle(el).translate;
      if (!t || t === "none" || t === "0px" || t === "0px 0px") return;
      el.style.transition = getComputedStyle(el).transition + ", translate .8s cubic-bezier(.3, 1.2, .4, 1)";
      el.style.translate = "0px 0px";
      setTimeout(() => { el.style.transition = ""; }, 900);
    });
  }
  const armIdle = () => { clearTimeout(idleT); idleT = setTimeout(returnAll, 10000); };
  ["pointermove", "pointerdown", "keydown", "wheel", "touchstart", "scroll"].forEach(ev => addEventListener(ev, armIdle, { passive:true }));
  armIdle();

  const gal = $("gal"), port = $("port"), grid = $("grid");
  let built = false;
  function build() {
    built = true;
    const Rg = rnd(7);
    PHOTOS.forEach((n, i) => {
      const b = document.createElement("button");
      b.className = "fr"; b.type = "button"; b.setAttribute("aria-label", title(n));
      b.dataset.n = "№" + String(i + 1).padStart(2, "0");
      b.style.setProperty("--r", ((Rg() - .5) * 5.2).toFixed(2) + "deg");
      b.style.setProperty("--y", Math.round((Rg() - .5) * 24) + "px");
      if (i % 7 === 2) b.classList.add("wide");
      const img = new Image(); img.alt = ""; img.loading = "lazy";
      img.onload = () => img.classList.add("in");
      img.onerror = () => { console.warn("Не найдено фото:", n); b.remove(); };
      img.src = src(n);
      b.addEventListener("pointerenter", () => { if (reduce) return; img.classList.remove("gl"); void img.offsetWidth; img.classList.add("gl"); });
      img.addEventListener("animationend", () => img.classList.remove("gl"));
      b.appendChild(img); b.onclick = () => show(i);
      grid.appendChild(b);
    });
  }
  port.onclick = e => {
    e.preventDefault();
    if (!built) build();
    const open = gal.classList.toggle("open");
    port.setAttribute("aria-expanded", open);
    if (open) setTimeout(() => gal.scrollIntoView({ behavior:"smooth", block:"start" }), 150);
  };

  const view = $("view"), vimg = view.querySelector("img");
  let cur = 0;
  function show(i) {
    const N = PHOTOS.length; cur = (i + N) % N;
    vimg.src = src(PHOTOS[cur]);
    $("cap").textContent = title(PHOTOS[cur]);
    $("cnt").textContent = (cur + 1) + " / " + N;
    setZoom(false);
    view.classList.add("on");
  }
  const close = () => { view.classList.remove("on"); setZoom(false); };
  $("prev").onclick = e => { e.stopPropagation(); show(cur - 1); };
  $("next").onclick = e => { e.stopPropagation(); show(cur + 1); };
  $("x").onclick = close;
  view.onclick = e => { if (e.target === view) close(); };
  const zbox = $("zbox"); let zoomed = false, Z = 2.5;
  vimg.draggable = false;
  function origin(cx, cy) {
    const r = zbox.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (cx - r.left) / r.width)), y = Math.min(1, Math.max(0, (cy - r.top) / r.height));
    vimg.style.transformOrigin = `${x * 100}% ${y * 100}%`;
  }
  function setZoom(on, cx, cy) {
    zoomed = on; zbox.classList.toggle("z", on);
    if (on) origin(cx, cy);
    vimg.style.transform = `scale(${on ? Z : 1})`;
  }
  zbox.addEventListener("click", e => setZoom(!zoomed, e.clientX, e.clientY));
  zbox.addEventListener("pointermove", e => { if (zoomed && e.pointerType === "mouse") origin(e.clientX, e.clientY); });
  zbox.addEventListener("wheel", e => {
    if (!zoomed) return;
    e.preventDefault(); Z = Math.min(8, Math.max(1.5, Z + (e.deltaY < 0 ? .5 : -.5))); vimg.style.transform = `scale(${Z})`;
  }, { passive:false });
  addEventListener("keydown", e => {
    if (!view.classList.contains("on")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
  let sx = null;
  view.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive:true });
  view.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (!zoomed && Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });
</script>
</body>
</html>
